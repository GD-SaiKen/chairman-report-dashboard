<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HTML 报告导入</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="manage.css"></head><body><main id="workbench"><header><p>公司 AI 驾驶舱 · 管理工作台</p><h1>HTML 报告导入</h1><span id="status">尚未创建期次</span></header><ol id="steps" class="steps"></ol><section><h2>1. 创建或打开期次</h2><form id="period-form"><label>期次 ID<input name="id" type="date" required></label><label>展示名称<input name="label" required></label><label>数据窗口<input name="window" required></label><label>数据截至<input name="asOf" type="datetime-local" required></label><button>创建期次</button></form></section><section><h2>2. 上传 HTML 报告</h2><form id="upload-form"><input name="file" type="file" accept=".html,.htm,text/html" required><input name="title" placeholder="报告标题" required><select name="reportType"><option value="info-weekly">信息部周报</option><option value="project-report">项目报告</option><option value="department-report">部门报告</option><option value="other">其他</option></select><input name="departmentId" placeholder="来源一级部门 ID"><label><input name="publishOriginal" type="checkbox" value="true">发布净化后全文</label><button>上传</button></form><button id="extract" type="button">开始解析</button></section><section><h2>3. 提取与质量审核</h2><div id="candidate-summary" class="summary"></div><ul id="issues"></ul><form id="approve-form"><input name="actor" placeholder="审核人显示名" required><button>确认审核完成</button></form></section><section><h2>4. 发布</h2><form id="publish-form"><input name="actor" placeholder="发布人显示名" required><button>确认发布本期</button></form></section><p id="live" role="status" aria-live="polite"></p></main><script type="module" src="app.js"></script></body></html>
